apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: web

spec:
  serviceName: nginx
  replicas: 3

  selector:
    matchLabels:
      app: nginx

  template: # define pod template
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine

          ports:
            - containerPort: 80
              name: web

          volumeMounts:
            - name: www
              mountPath: /usr/share/nginx/html

  volumeClaimTemplates: # StatefulSet uses this claim template to create persistent volume claims for each replica
    - metadata:
        name: www

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 1Gi